<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "Seguros Lagun Aro" }}</title>
    <meta name="description" content="Landing de simulación de préstamo." />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  </head>
  <body>
    <div id="aurora"></div>

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="{{ url_for('index') }}">
          <div
            class="animated-gradient-text with-border brand-logo"
            id="gradientText"
            data-direction="horizontal"
            data-speed="8"
            data-pause-on-hover="false"
            data-yoyo="true"
            data-colors="#5227FF,#FF9FFC,#B19EEF"
          >
            <div class="gradient-overlay"></div>
            <div class="text-content">Seguros Lagun Aro</div>
          </div>
        </a>
        <nav class="nav">
          <a href="{{ url_for('index') }}" class="nav-link">Inicio</a>
          <a href="{{ url_for('identificacion') }}" class="nav-link">Simulador</a>
          <a href="{{ url_for('historial') }}" class="nav-link">Historial</a>
        </nav>
      </div>
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>Seguros Lagun Aro · 2026</p>
        <p class="footer-note">Interfaz académica para el Reto 07.</p>
      </div>
    </footer>

    <div id="global-loading" class="loading-overlay" aria-hidden="true">
      <div class="loading" role="status" aria-live="polite" aria-label="Cargando">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
      <p class="loading-text">Cargando...</p>
    </div>

    <script src="{{ url_for('static', filename='js/aurora.js') }}"></script>
    <script>
      const globalLoader = document.getElementById("global-loading");

      const showLoader = () => {
        if (!globalLoader) return;
        globalLoader.classList.add("is-visible");
        globalLoader.setAttribute("aria-hidden", "false");
      };

      const hideLoader = () => {
        if (!globalLoader) return;
        globalLoader.classList.remove("is-visible");
        globalLoader.setAttribute("aria-hidden", "true");
      };

      window.addEventListener("pageshow", hideLoader);
      window.addEventListener("load", hideLoader);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          hideLoader();
        }
      });

      document.querySelectorAll("a[href]").forEach((link) => {
        const href = link.getAttribute("href");
        if (!href || href.startsWith("#") || href.startsWith("http")) {
          return;
        }
        link.addEventListener("click", (event) => {
          event.preventDefault();
          showLoader();
          setTimeout(() => {
            window.location.href = href;
          }, 1500);
        });
      });

      document.querySelectorAll("form").forEach((form) => {
        if (form.id === "simulador-form") return;
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          showLoader();
          setTimeout(() => form.submit(), 1500);
        });
      });

      const revealBlocks = document.querySelectorAll(".scroll-reveal-text");
      if (revealBlocks.length) {
        revealBlocks.forEach((block) => {
          const words = block.textContent.trim().split(" ");
          block.innerHTML = words
            .map(
              (word, index) =>
                `<span class="word" style="--delay:${index * 40}ms">${word}&nbsp;</span>`
            )
            .join("");
        });

        if ("IntersectionObserver" in window) {
          const observer = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  entry.target.classList.add("is-visible");
                }
              });
            },
            { threshold: 0.3 }
          );
          revealBlocks.forEach((block) => observer.observe(block));
        } else {
          revealBlocks.forEach((block) => block.classList.add("is-visible"));
        }
      }

      const floatingImages = document.querySelectorAll(".scroll-float-image");
      const introOverlayText = document.getElementById("intro-overlay-text");
      if (floatingImages.length) {
        const scrollThreshold = 35;
        let hasRevealedFloatingImages = false;

        const revealFloatingImages = () => {
          if (hasRevealedFloatingImages) return;
          hasRevealedFloatingImages = true;

          floatingImages.forEach((image) => image.classList.add("is-visible"));
          if (introOverlayText) {
            introOverlayText.textContent = "hay un seguro";
            introOverlayText.classList.add("is-switched");
          }

          window.removeEventListener("scroll", onScrollReveal);
          window.removeEventListener("wheel", onWheelReveal);
          window.removeEventListener("touchmove", onTouchReveal);
          window.removeEventListener("keydown", onKeyReveal);
        };

        const onScrollReveal = () => {
          if (window.scrollY > scrollThreshold) {
            revealFloatingImages();
          }
        };

        const onWheelReveal = (event) => {
          if (event.deltaY > 0) {
            revealFloatingImages();
          }
        };

        const onTouchReveal = () => {
          if (window.scrollY > 0) {
            revealFloatingImages();
          }
        };

        const onKeyReveal = (event) => {
          if (["ArrowDown", "PageDown", " ", "Spacebar"].includes(event.key)) {
            revealFloatingImages();
          }
        };

        window.addEventListener("scroll", onScrollReveal, { passive: true });
        window.addEventListener("wheel", onWheelReveal, { passive: true });
        window.addEventListener("touchmove", onTouchReveal, { passive: true });
        window.addEventListener("keydown", onKeyReveal);
        onScrollReveal();
      }

    </script>
  </body>
</html>
